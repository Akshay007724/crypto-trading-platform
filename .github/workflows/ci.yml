name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -e . ruff mypy pytest pytest-asyncio
      - run: ruff check .
      - run: mypy src/hft --ignore-missing-imports
      - run: pytest
